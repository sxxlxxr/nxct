name: Linux release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'textual==6.12.0' 'pyinstaller==6.22.3'
      - name: Check source and user interface
        run: |
          python -B - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import ssl
          import sys
          from threading import Event
          from unittest.mock import patch
          from textual.widgets import LoadingIndicator
          import app

          async def check():
              with patch.object(app, 'SETTINGS_PATH', Path('/tmp/nxct-ci-no-settings.json')):
                  ui = app.CatalogueApp()
              assert ui.settings.downloads_dir == ''
              assert ui.settings.theme == 'nxct-mono'
              assert len(ui.settings.sources) == 5
              assert all(s.name.lower() != 'steamrip' for s in ui.settings.sources)
              assert all(value[1:3] == value[3:5] == value[5:7]
                         for value in app.THEME_PALETTES['nxct-mono'].values())
              assert ui.available_themes['nxct-mono'].error == '#bdbdbd'
              ui.settings.startup_animation = False
              async with ui.run_test(size=(80, 24)) as pilot:
                  await pilot.pause()
                  await pilot.click('#open-market')
                  await pilot.pause()
                  await pilot.click('#open-settings')
                  await pilot.pause()

                  ui.settings.startup_animation = True
                  ui.action_tab('search-tab')
                  await pilot.pause()
                  search_gate = Event()

                  def delayed_search(*_args):
                      assert search_gate.wait(5)
                      return [], 0, 1

                  with patch.object(app, 'fetch_source_page', side_effect=delayed_search):
                      search = asyncio.create_task(ui.load_remote_page(1, '', ui.settings.sources[:1], 'all'))
                      try:
                          await asyncio.sleep(0.05)
                          assert ui.query_one('#search-loading', LoadingIndicator).display
                      finally:
                          search_gate.set()
                      await search
                  assert not ui.query_one('#search-loading', LoadingIndicator).display

                  ui.action_tab('settings-tab')
                  await pilot.pause()
                  update_gate = Event()

                  def delayed_update():
                      assert update_gate.wait(5)
                      return app.APP_VERSION

                  with patch.object(app, 'latest_release_version', side_effect=delayed_update):
                      update = asyncio.create_task(ui.check_updates())
                      try:
                          await asyncio.sleep(0.05)
                          assert ui.query_one('#update-loading', LoadingIndicator).display
                      finally:
                          update_gate.set()
                      await update
                  assert not ui.query_one('#update-loading', LoadingIndicator).display

          asyncio.run(check())

          with patch.object(sys, 'frozen', True, create=True), \
               patch.object(ssl, 'get_default_verify_paths', return_value=type('Paths', (), {'cafile': None})()), \
               patch.dict(os.environ, {'LD_LIBRARY_PATH': '/nxct/_internal'}):
              context = app.https_context()
              assert context.verify_mode == ssl.CERT_REQUIRED and context.check_hostname
              assert context.get_ca_certs(), 'system CA bundle not loaded'
              os.environ.pop('LD_LIBRARY_PATH_ORIG', None)
              assert 'LD_LIBRARY_PATH' not in app.installer_environment()
              os.environ['LD_LIBRARY_PATH_ORIG'] = '/original'
              assert app.installer_environment()['LD_LIBRARY_PATH'] == '/original'
          PY
      - name: Build standalone NXCT
        run: |
          python -B - "$GITHUB_REF_NAME" <<'PY'
          import sys
          from app import APP_VERSION
          assert sys.argv[1] == f'v{APP_VERSION}', 'tag must match app.py APP_VERSION'
          PY
          python -m PyInstaller --clean --noconfirm --onedir --collect-all textual --name nxct app.py
          printf '%s\n' "${GITHUB_REF_NAME#v}" > dist/version.txt
          cp install.sh dist/nxct/install.sh
          cp LICENSE dist/nxct/LICENSE-NXCT
          chmod 755 dist/nxct/install.sh
      - name: Start packaged NXCT in a clean terminal
        run: |
          python -B - <<'PY'
          import fcntl
          import json
          import os
          import pty
          import select
          import struct
          import subprocess
          import tempfile
          import termios
          import time
          from pathlib import Path

          binary = Path('dist/nxct/nxct').resolve()
          with tempfile.TemporaryDirectory() as home:
              master, slave = pty.openpty()
              fcntl.ioctl(slave, termios.TIOCSWINSZ, struct.pack('HHHH', 30, 100, 0, 0))
              env = dict(os.environ, HOME=home, TERM='xterm-256color')
              process = subprocess.Popen([str(binary)], stdin=slave, stdout=slave, stderr=slave,
                                         env=env, start_new_session=True)
              os.close(slave)
              output = bytearray()
              deadline = time.monotonic() + 4
              try:
                  while time.monotonic() < deadline:
                      ready, _, _ = select.select([master], [], [], 0.2)
                      if ready:
                          try:
                              output.extend(os.read(master, 65536))
                          except OSError:
                              break
                      if process.poll() is not None:
                          break
              finally:
                  if process.poll() is None:
                      process.terminate()
                  process.wait(timeout=8)
                  os.close(master)
              assert b'NXCT' in output and b'Traceback' not in output, repr(output[-2000:])

              # The published release is still the previous one at this point.
              # Exercise the real update-check button in the packaged binary.
              settings = Path(home) / '.config/nxct/settings.json'
              settings.parent.mkdir(parents=True)
              settings.write_text(json.dumps({'startup_animation': False, 'sources': []}))
              master, slave = pty.openpty()
              fcntl.ioctl(slave, termios.TIOCSWINSZ, struct.pack('HHHH', 55, 120, 0, 0))
              process = subprocess.Popen([str(binary)], stdin=slave, stdout=slave, stderr=slave,
                                         env=env, start_new_session=True)
              os.close(slave)
              output = bytearray()

              def collect(seconds):
                  deadline = time.monotonic() + seconds
                  while time.monotonic() < deadline:
                      ready, _, _ = select.select([master], [], [], 0.1)
                      if ready:
                          try:
                              output.extend(os.read(master, 65536))
                          except OSError:
                              break
                      if process.poll() is not None:
                          break

              try:
                  collect(1.5)
                  os.write(master, b'4')
                  for _ in range(40):
                      collect(0.2)
                      if 'ОБНОВЛЕНИЯ'.encode() in output:
                          break
                  assert 'ОБНОВЛЕНИЯ'.encode() in output, repr(output[-2000:])
                  for _ in range(17):
                      os.write(master, b'\t')
                      collect(0.12)
                  output.clear()
                  os.write(master, b'\r')
                  for _ in range(60):
                      collect(0.25)
                      if b'\xd0\x94\xd0\xbe\xd1\x81\xd1\x82\xd1\x83\xd0\xbf\xd0\xbd\xd0\xb0' in output or \
                              'Установлена актуальная версия'.encode() in output:
                          break
                  assert ('Доступна версия'.encode() in output or
                          'Установлена актуальная версия'.encode() in output), repr(output[-2000:])
                  assert b'CERTIFICATE_VERIFY_FAILED' not in output
              finally:
                  if process.poll() is None:
                      process.terminate()
                  process.wait(timeout=8)
                  os.close(master)
          PY
      - name: Include verified rqbit 9.1.0 and its license
        run: |
          curl -fLsS --retry 3 -o dist/nxct/rqbit \
            https://github.com/ikatson/rqbit/releases/download/v9.1.0/rqbit-linux-amd64
          printf '%s  %s\n' \
            '921061a82ee6a6b26754c6367886b5b6b4ce5916d3edd5db79c6cd5f2c23499f' \
            'dist/nxct/rqbit' | sha256sum -c -
          chmod 755 dist/nxct/rqbit
          dist/nxct/rqbit --version
          curl -fLsS --retry 3 -o dist/nxct/LICENSE-rqbit \
            https://raw.githubusercontent.com/ikatson/rqbit/v9.1.0/LICENSE
          curl -fLsS --retry 3 -o dist/nxct/Apache-2.0.txt \
            https://www.apache.org/licenses/LICENSE-2.0.txt
      - name: Pack release with checksum
        run: |
          tar -czf nxct-linux-x86_64.tar.gz -C dist nxct version.txt
          sha256sum nxct-linux-x86_64.tar.gz > SHA256SUMS
      - name: Install the release in a clean home before publishing
        run: |
          python -B - <<'PY'
          import fcntl
          import json
          import os
          from pathlib import Path
          import pty
          import select
          import struct
          import subprocess
          import tempfile
          import termios
          import time

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          tag = os.environ['GITHUB_REF_NAME']
          with tempfile.TemporaryDirectory() as sandbox:
              root = Path(sandbox)
              home = root / 'home'
              home.mkdir()
              settings = home / '.config/nxct/settings.json'
              settings.parent.mkdir(parents=True)
              settings.write_text(json.dumps({
                  'downloads_dir': '', 'games_dir': str(home), 'sources': [],
                  'theme': 'nxct', 'startup_animation': False,
              }))
              original_settings = settings.read_bytes()

              fake_bin = root / 'mock-bin'
              fake_bin.mkdir()
              fake_curl = fake_bin / 'curl'
              fake_curl.write_text('''#!/usr/bin/env python3
          import os
          from pathlib import Path
          import shutil
          import sys

          args = sys.argv[1:]
          url = args[-1]
          prefix = 'https://github.com/sxxlxxr/nxct/releases/'
          assert url.startswith(prefix), url
          route, filename = url[len(prefix):].rsplit('/', 1)
          assert route in ('latest/download', 'download/' + os.environ['GITHUB_REF_NAME']), route
          assert filename in ('nxct-linux-x86_64.tar.gz', 'SHA256SUMS'), filename
          destination = Path(args[args.index('-o') + 1])
          shutil.copyfile(Path(os.environ['GITHUB_WORKSPACE']) / filename, destination)
          if os.getenv('NXCT_TEST_CORRUPT') and filename.endswith('.tar.gz'):
              with destination.open('ab') as stream:
                  stream.write(b'corrupt')
          ''')
              fake_curl.chmod(0o755)
              env = dict(os.environ, HOME=str(home), XDG_DATA_HOME=str(root / 'data'),
                         PATH=str(fake_bin) + os.pathsep + os.environ['PATH'], TERM='xterm-256color')

              def install(*args, environment=env):
                  return subprocess.run(['sh', str(workspace / 'install.sh'), *args],
                                        env=environment, capture_output=True, text=True, timeout=120)

              first = install()
              assert first.returncode == 0, (first.stdout, first.stderr)
              current = root / 'data/nxct/current'
              launcher = home / '.local/bin/nxct'
              assert current.is_symlink() and launcher.is_symlink()
              assert (current / 'version.txt').read_text().strip() == tag[1:]
              assert launcher.resolve() == (current / 'nxct/nxct').resolve()
              assert subprocess.run([str(current / 'nxct/rqbit'), '--version'],
                                    capture_output=True, timeout=10).returncode == 0
              assert settings.read_bytes() == original_settings

              master, slave = pty.openpty()
              fcntl.ioctl(slave, termios.TIOCSWINSZ, struct.pack('HHHH', 30, 100, 0, 0))
              process = subprocess.Popen([str(launcher)], stdin=slave, stdout=slave, stderr=slave,
                                         env=env, start_new_session=True)
              os.close(slave)
              output = bytearray()
              deadline = time.monotonic() + 4
              try:
                  while time.monotonic() < deadline:
                      ready, _, _ = select.select([master], [], [], 0.2)
                      if ready:
                          try:
                              output.extend(os.read(master, 65536))
                          except OSError:
                              break
                      if process.poll() is not None:
                          break
              finally:
                  if process.poll() is None:
                      process.terminate()
                  process.wait(timeout=8)
                  os.close(master)
              assert b'NXCT' in output and b'Traceback' not in output, repr(output[-2000:])

              again = install('--version', tag)
              assert again.returncode == 0, (again.stdout, again.stderr)
              assert settings.read_bytes() == original_settings
              old_version = current.resolve()
              corrupt = install('--version', tag, environment=dict(env, NXCT_TEST_CORRUPT='1'))
              assert corrupt.returncode != 0 and 'контрольная сумма не совпадает' in corrupt.stderr
              assert current.resolve() == old_version and settings.read_bytes() == original_settings
              assert not list((root / 'data/nxct').glob('.install.*'))
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            nxct-linux-x86_64.tar.gz SHA256SUMS \
            --verify-tag --title "NXCT $GITHUB_REF_NAME" --generate-notes
